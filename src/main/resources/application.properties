# App name
spring.application.name=standup-iq
spring.config.import=optional:file:.env[.properties]

# Database
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/standupiq}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:standupuser}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:standup123}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# Flyway
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0

# Disable Spring Security for now (we'll add it back later)
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.security.servlet.SecurityAutoConfiguration

# Server port
server.port=${PORT:8080}
server.error.include-stacktrace=never

# OpenAPI / Swagger
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs

github.token=${GITHUB_TOKEN:}
github.api.base-url=https://api.github.com

gemini.api.key=${GEMINI_API_KEY:}
gemini.api.base-url=https://generativelanguage.googleapis.com
gemini.model=gemini-2.5-flash

# Slack
slack.enabled=${SLACK_ENABLED:false}
slack.webhook.url=${SLACK_WEBHOOK_URL:}

# Scheduled standup generation
standup.scheduler.enabled=${STANDUP_SCHEDULER_ENABLED:false}
standup.scheduler.cron=${STANDUP_SCHEDULER_CRON:0 45 8 * * MON-FRI}
standup.scheduler.zone=${STANDUP_SCHEDULER_ZONE:Asia/Kolkata}
standup.scheduler.username=${STANDUP_SCHEDULER_USERNAME:}
standup.scheduler.owner=${STANDUP_SCHEDULER_OWNER:}
standup.scheduler.repo=${STANDUP_SCHEDULER_REPO:}
standup.scheduler.branch=${STANDUP_SCHEDULER_BRANCH:}
standup.scheduler.days=${STANDUP_SCHEDULER_DAYS:1}
standup.scheduler.send-to-slack=${STANDUP_SCHEDULER_SEND_TO_SLACK:false}
